name: SHUN-X Lite public interaction checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'boot.js'
      - 'app.js'
      - 'enrollment.js'
      - 'sw.js'
      - 'browser-registration.js'
      - 'tests/**'
      - '.github/workflows/ui-check.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
jobs:
  unit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for f in app.js enrollment.js browser-registration.js sw.js boot.js; do
            node --input-type=module --check < "$f"
          done
      - name: Test startup and touch-button behavior
        run: node --test tests/ui.test.mjs
  deployed:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed static PWA files and JavaScript MIME
        run: |
          set -eu
          base='https://ogasawaratouei1998-lgtm.github.io/shun-x-lite-app'
          for n in $(seq 1 18); do
            if curl -fsSL --retry 1 "$base/index.html" | grep -q 'enrollment.js?v=7'; then break; fi
            if [ "$n" = 18 ]; then echo 'PAGES_UPDATE_MISSING'; exit 1; fi
            sleep 5
          done
          curl -fsSL --retry 2 "$base/enrollment.js" | grep -q 'browser-registration.js'
          curl -fsSL --retry 2 "$base/sw.js" | grep -q 'shunx-pages-preview-v7'
          curl -fsSL --retry 2 "$base/boot.js" | grep -q 'shunxEnrollmentBooted'
          curl -fsSI --retry 2 "$base/browser-registration.js" | tr -d '\r' | grep -Ei '^content-type: *(text/javascript|application/javascript|application/x-javascript)' >/dev/null
          echo 'DEPLOYED_PWA_V6_VERIFIED: source loaded; no backend registration attempted'
